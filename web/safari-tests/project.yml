name: SafariReaderSmoke
options:
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  SafariReaderLauncher:
    type: application
    platform: iOS
    sources: [Launcher]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.campusreader.tests.safarilauncher
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SafariReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SafariReaderLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.campusreader.tests.safariuitests
schemes:
  SafariReaderSmoke:
    build:
      targets:
        SafariReaderLauncher: all
    test:
      targets: [SafariReaderUITests]
