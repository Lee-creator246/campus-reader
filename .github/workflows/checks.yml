name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check public source boundary
        run: python3 scripts/check_public_tree.py --tracked
      - name: Verify core behavior with synthetic data
        run: bash ./gradlew :checks:verify -PcampusTestDefaults=true --no-daemon --console=plain
